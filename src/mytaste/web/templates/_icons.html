{# Collection icons: 24px line drawings stroked with the current colour. Keys match ICONS. #}
{% macro collection_icon(name, class="collection-icon") -%}
  {%- if name -%}
  <svg class="{{ class }}" aria-hidden="true" viewBox="0 0 24 24">
    {%- if name == "bookmark" -%}<path d="M6.5 4.5h11v15.5l-5.5-4-5.5 4V4.5Z"></path>
    {%- elif name == "heart" -%}<path d="M12 19.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 6.8a4.3 4.3 0 0 1 7.5 2.7c0 5.4-7.5 10-7.5 10Z"></path>
    {%- elif name == "star" -%}<path d="m12 4 2.4 5 5.4.7-4 3.8 1 5.4-4.8-2.6-4.8 2.6 1-5.4-4-3.8 5.4-.7L12 4Z"></path>
    {%- elif name == "flame" -%}<path d="M12 20.5a6 6 0 0 1-6-6c0-3.5 2.5-5.5 3.5-8.5 1.5 1.5 2 3 2 4.5 1-.5 2-2 2.2-3.5 2.3 2 4.3 4.6 4.3 7.5a6 6 0 0 1-6 6Z"></path><path d="M12 20.5a2.5 2.5 0 0 1-2.5-2.5c0-1.6 1.4-2.4 2.5-4 1.1 1.6 2.5 2.4 2.5 4a2.5 2.5 0 0 1-2.5 2.5Z"></path>
    {%- elif name == "sparkle" -%}<path d="M10 4.5 11.6 9l4.4 1.5-4.4 1.6L10 16.5l-1.6-4.4L4 10.5 8.4 9 10 4.5ZM17.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"></path>
    {%- elif name == "clock" -%}<circle cx="12" cy="12" r="8"></circle><path d="M12 7.5V12l3 2"></path>
    {%- elif name == "eye" -%}<path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6Z"></path><circle cx="12" cy="12" r="2.6"></circle>
    {%- elif name == "film" -%}<rect x="4" y="4.5" width="16" height="15" rx="2"></rect><path d="M8 4.5v15M16 4.5v15M4 9h4M4 15h4M16 9h4M16 15h4"></path>
    {%- elif name == "tv" -%}<rect x="3.5" y="6.5" width="17" height="11.5" rx="2"></rect><path d="m9 3.5 3 3 3-3M8.5 21h7"></path>
    {%- elif name == "smile" -%}<circle cx="12" cy="12" r="8"></circle><path d="M8.8 14a4 4 0 0 0 6.4 0M9.5 9.8h.01M14.5 9.8h.01"></path>
    {%- elif name == "ghost" -%}<path d="M6 20V10.5a6 6 0 0 1 12 0V20l-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6L6 20Z"></path><path d="M10 10.5h.01M14 10.5h.01"></path>
    {%- elif name == "rocket" -%}<path d="M14.5 4.5c3 0 5 2 5 5 0 3.5-3.5 6.5-7 8.5l-5-5c2-3.5 5-8.5 7-8.5Z"></path><path d="M9.5 10H6l-2 3 3.5.5M14 14.5V18l-3 2-.5-3.5M15 9h.01M5 19c.5-1.6 1.4-2.5 3-3"></path>
    {%- elif name == "trophy" -%}<path d="M8 4.5h8v5a4 4 0 0 1-8 0v-5ZM8 6.5H5a3 3 0 0 0 3 4M16 6.5h3a3 3 0 0 1-3 4M12 13.5v3M8.5 19.5h7l-1-3h-5l-1 3Z"></path>
    {%- elif name == "gift" -%}<rect x="4" y="9" width="16" height="4" rx="1"></rect><path d="M5.5 13v6.5h13V13M12 9v10.5M12 9c-1-3-4.5-4-5-2s2.5 2 5 2Zm0 0c1-3 4.5-4 5-2s-2.5 2-5 2Z"></path>
    {%- elif name == "folder" -%}<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2h8.8A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z"></path>
    {%- else -%}<path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"></path>
    {%- endif -%}
  </svg>
  {%- endif -%}
{%- endmacro %}
