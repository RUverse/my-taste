[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mytaste"
version = "0.4.0"
description = "A self-hosted guide to new movies and shows on your streaming services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/RUverse/mytaste"
Issues = "https://github.com/RUverse/mytaste/issues"

[project.scripts]
mytaste = "mytaste.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mytaste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
